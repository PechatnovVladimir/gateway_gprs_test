syntax = "proto3";

package github.com.PechatnovVladimir.gateway_gprs_test.auth;

option go_package = "github.com/PechatnovVladimir/gateway_gprs_test/auth/api;auth";

import "google/api/annotations.proto";

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      get: "/v1/login/{name}",
    };
  };
}

message LoginRequest {
  string name = 1;
}

message LoginResponse {
  string message = 1;
}


