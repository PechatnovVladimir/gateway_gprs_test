version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: auth-service
    ports:
      - "50051:50051"
    networks:
      - msa-network
    restart: unless-stopped
    environment:
      - GRPC_PORT=50051

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - msa-network
    restart: unless-stopped
    depends_on:
      - auth-service
    environment:
      - PORT=8080

networks:
  msa-network:
    driver: bridge